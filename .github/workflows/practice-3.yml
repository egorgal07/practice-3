name: Practice 3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-test:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15

    defaults:
      run:
        shell: powershell

    steps:
      - name: Получить файлы проекта
        uses: actions/checkout@v4

      - name: Создать .env из секретов
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          $lines = foreach ($name in 'DB_NAME', 'DB_USER', 'DB_PASSWORD') {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrEmpty($value)) { throw "Missing secret $name" }
            $escaped = $value.Replace("'", "\'")
            "$name='$escaped'"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD '.env'), [string[]]$lines)
          @('DB_NAME=***', 'DB_USER=***', 'DB_PASSWORD=***') |
            Set-Content evidence/env-masked.txt

      - name: Запустить контейнеры
        run: |
          docker compose up -d --build --wait --wait-timeout 90
          if ($LASTEXITCODE -ne 0) { throw 'Docker Compose failed to start' }

      - name: Сравнить данные PostgreSQL и приложения
        run: |
          $response = $null
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing `
                -Uri 'http://localhost:8080/api/items' -TimeoutSec 5
              break
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if ($null -eq $response) { throw 'The API did not respond' }

          $sql = 'SELECT id, name FROM items ORDER BY id'
          $rows = $sql | docker compose exec -T db sh -c 'psql -X -A -t -F "|" -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL query failed' }

          $expected = @($rows | Where-Object { $_ -ne '' })
          $actual = @(
            $response.Content | ConvertFrom-Json |
              ForEach-Object { "$($_.id)|$($_.name)" }
          )
          if ($expected.Count -eq 0) { throw 'The items table is empty' }
          if (($expected -join "`n") -cne ($actual -join "`n")) {
            throw 'The API items differ from PostgreSQL'
          }

          $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://localhost:8080/' -TimeoutSec 5
          "PASS: PostgreSQL and /api/items returned the same $($actual.Count) records. Web page HTTP $($page.StatusCode)." |
            Tee-Object -FilePath evidence/test-results.txt

      - name: Собрать состояние и логи контейнеров
        if: always()
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          if (Test-Path .env) {
            docker compose ps -a | Out-File evidence/docker-ps.txt
            docker compose logs --no-color | Out-File evidence/docker-logs.txt
          }
          if (!(Test-Path evidence/test-results.txt)) {
            'Checks did not complete. See the failed step in GitHub Actions.' |
              Set-Content evidence/test-results.txt
          }

      - name: Сохранить артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-3-results
          path: evidence/

      - name: Остановить контейнеры и удалить временный .env
        if: always()
        run: |
          if (Test-Path .env) {
            docker compose down
            $composeExit = $LASTEXITCODE
            Remove-Item -LiteralPath .env
            if ($composeExit -ne 0) { throw 'Docker Compose cleanup failed' }
          }
